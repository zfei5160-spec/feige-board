name: Auto Sync Feishu Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch All Feishu Data
        env:
          APP_ID: ${{ secrets.FEISHU_APP_ID }}
          APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          python - << 'EOF'
          import os, json, requests

          app_id = os.environ['APP_ID']
          app_secret = os.environ['APP_SECRET']

          # 1. 获取 Token
          token_url = "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal"
          token_res = requests.post(token_url, json={"app_id": app_id, "app_secret": app_secret}).json()
          token = token_res.get("tenant_access_token")

          # 2. 循环翻页获取全量数据
          records_url = "https://open.feishu.cn/open-apis/bitable/v1/apps/O4W5bYLWJa5GFxsrEUecyljynq7/tables/tbl0kSbPtXCj368j/records"
          headers = {"Authorization": f"Bearer {token}"}
          all_items = []
          page_token = ""
          has_more = True

          while has_more:
              params = {"page_size": 500}
              if page_token:
                  params["page_token"] = page_token
              
              res = requests.get(records_url, headers=headers, params=params).json()
              data = res.get("data", {})
              items = data.get("items", [])
              all_items.extend(items)
              
              has_more = data.get("has_more", False)
              page_token = data.get("page_token", "")

          # 3. 保存为全量 data.json
          result = {"code": 0, "msg": "success", "data": {"items": all_items, "total": len(all_items)}}
          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False)
          print(f"成功拉取全量数据，共 {len(all_items)} 条记录！")
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
